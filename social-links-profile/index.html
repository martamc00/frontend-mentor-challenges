<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Social links profile</title>
</head>


<body>

  <div class="card">
    <div class="profile-pic">
      <img src="assets/images/me.jpg" alt="profile picture of Marta">
    </div>

    <div class="identification">
      <h2>Marta Cardoso</h2>
      <p>Porto, Portugal</p>
    </div>

    <p class="description">"Front-end developer and avid gamer."</p>

    <div class="social-links">
      <button><a href="https://github.com/martamc00">GitHub</a></button>
      <button><a href="https://www.frontendmentor.io/profile/martamc00">Frontend Mentor</a></button>
      <button><a href="https://www.linkedin.com/in/marta-miranda-cardoso/">LinkedIn</a></button>
      <button><a href="https://www.instagram.com/marta.ux.dev">Instagram</a></button>
    </div>
  </div>


  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Marta Cardoso</a>.
  </footer>
</body>
</html>
